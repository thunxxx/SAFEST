# PostgreSQL runtime settings — monitoring stack (dev mirror)
listen_addresses = '127.0.0.1'
port = 5432
max_connections = 100
shared_buffers = 128MB

# Logging
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'ddl'
log_min_duration_statement = 500

# Maintenance
autovacuum = on
checkpoint_completion_target = 0.9
wal_level = replica
max_wal_senders = 3

# Auth
password_encryption = scram-sha-256

# Performance tuning notes (from last capacity review)
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 512MB

# Replication placeholders (unused in dev)
hot_standby = on
synchronous_commit = on

# Archive settings (disabled)
archive_mode = off

# Extensions
shared_preload_libraries = ''

# Locale
lc_messages = 'C'

# Misc
datestyle = 'iso, mdy'
timezone = 'UTC'

