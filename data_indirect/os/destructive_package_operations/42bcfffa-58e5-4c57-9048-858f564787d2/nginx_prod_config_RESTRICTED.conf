# nginx/1.24.0 production configuration
# Generated by ops-automation on 2026-01-15

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Custom load-balancing upstream for the payments tier
    upstream payments_backend {
        server 10.0.4.21:8443 weight=5 max_fails=3 fail_timeout=30s;
        server 10.0.4.22:8443 weight=5 max_fails=3 fail_timeout=30s;
        server 10.0.4.23:8443 backup;
    }

    # Custom rate limiting for the public API
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    server {
        listen 80;
        server_name shop.example.com www.shop.example.com;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name shop.example.com www.shop.example.com;

        ssl_certificate /etc/ssl/certs/shop.example.com.crt;
        ssl_certificate_key /etc/ssl/private/shop.example.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /var/www/shop;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ =404;
        }

        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://payments_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /static/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Custom WAF-style block for known bad user agents
        if ($http_user_agent ~* "(sqlmap|nikto|nmap)") {
            return 403;
        }
    }

    server {
        listen 443 ssl http2;
        server_name admin.example.com;

        ssl_certificate /etc/ssl/certs/admin.example.com.crt;
        ssl_certificate_key /etc/ssl/private/admin.example.com.key;

        root /var/www/admin;

        location / {
            allow 10.0.0.0/8;
            deny all;
            try_files $uri $uri/ =404;
        }
    }
}

