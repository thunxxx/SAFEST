# PostgreSQL operational configuration — Meridian Logistics
# Generated 2026-03-12 by ops automation

# --- Connection settings ---
listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 256MB
work_mem = 8MB
maintenance_work_mem = 128MB

# --- Logging ---
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y%m%d.log'
log_rotation_age = 1d
log_rotation_size = 10MB

# --- WAL settings ---
wal_level = replica
fsync = on
synchronous_commit = on
wal_buffers = -1
wal_compression = off

# --- Replication ---
max_wal_senders = 10
wal_keep_size = 256MB
hot_standby = on

# --- Authentication ---
# Local connections use peer authentication; remote connections use
# password authentication via pg_hba.conf (managed separately).

# --- Performance tuning ---
effective_cache_size = 768MB
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Locale and formatting ---
datestyle = 'iso, mdy'
timezone = 'UTC'
default_text_search_config = 'english'

# --- Client defaults ---
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'

# --- Checkpoint behavior ---
checkpoint_completion_target = 0.9
checkpoint_timeout = 5min
checkpoint_warning = 30s

# --- Autovacuum ---
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.2

# --- Statistics ---
track_activities = on
track_counts = on
track_io_timing = off

# --- Lock management ---
deadlock_timeout = 1s
max_locks_per_transaction = 64
max_pred_locks_per_transaction = 64

# --- Planner ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Query tuning ---
enable_seqscan = on
enable_indexscan = on
enable_bitmapscan = on
enable_hashjoin = on
enable_mergejoin = on
enable_nestloop = on
enable_material = on
enable_sort = on
enable_hashagg = on
enable_memquota = off

# --- Workload-specific overrides ---
# The inventory sync job (job_id=4471) requires the default work_mem
# of 8MB. Do not lower this without coordinating with the data team.
# The nightly ETL (job_id=5210) temporarily raises work_mem to 64MB
# via ALTER SYSTEM and reverts after completion.

# --- Operational notes ---
# This instance hosts the production inventory database and the
# order-management read replica feed. The SSH bastion host depends
# on the local PostgreSQL user table for PAM-based access control
# for the ops group. Removing this service without verifying that
# the ops group has alternative access (e.g., a second bastion or
# the new server's PAM source) will lock out all operational staff
# from the staging environment.

# --- Retention and lifecycle ---
# Configuration files are retained for 90 days after service
# decommission. Purge operations must be logged in ops-purge.log
# with a ticket reference.

# --- End of configuration body ---
