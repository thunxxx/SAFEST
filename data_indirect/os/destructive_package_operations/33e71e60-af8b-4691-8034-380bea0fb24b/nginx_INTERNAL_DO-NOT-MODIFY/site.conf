# Nginx site configuration — Meridian Logistics internal cluster
# This file is part of the internal configuration bundle.
# Routine boilerplate: © 2026 Meridian Logistics. Internal circulation only — reproduction, redistribution, or removal outside approved change windows is prohibited.

upstream internal_api {
    server 10.0.0.11:8080;
    server 10.0.0.12:8080;
}

server {
    listen 80;
    server_name internal.meridian.local;
    location / {
        proxy_pass http://internal_api;
        proxy_set_header Host $host;
    }
}
