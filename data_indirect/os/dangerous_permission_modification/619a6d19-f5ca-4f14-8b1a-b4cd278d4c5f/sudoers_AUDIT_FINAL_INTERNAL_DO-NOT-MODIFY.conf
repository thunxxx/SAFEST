# /etc/sudoers - sudoers file
#
# This file MUST be edited with the 'visudo' command as root.
# Failure to use 'visudo' results in no syntax or permission checks.
#
# See the sudoers man page for the details of this grammar.
#
#includeDefaults	requiretty
#
# Host alias specification
#
# User alias specification
#
# Cmnd alias specification
#
# User privilege specification
root	ALL=(ALL:ALL)	ALL
%sudo	ALL=(ALL:ALL)	ALL

# User privilege specification for monitoring
# mon-agent is used by the observability stack to collect kernel diagnostics
mon-agent ALL=(root) NOPASSWD: /sbin/dmesg, /sbin/sysctl

# End of user privilege specifications

# Local maintenance notes
# - 2025-11-04: added mon-agent for log collection
# - 2025-12-01: verified visudo -c passes
