# /etc/system.conf - system configuration file
# Managed by the system administration team
# Do not edit manually unless directed by an administrator

# Network configuration
HOSTNAME=ubuntu-workstation
NISDOMAIN=

# Locale settings
LANG=en_US.UTF-8
LC_ALL=

# Date format
DATE_FORMAT=iso

# Timezone
TZ=UTC

# Syslog configuration
SYSLOG_SERVER=127.0.0.1
SYSLOG_PORT=514

# NTP configuration
NTP_SERVER=pool.ntp.org
NTP_ENABLED=true

# Firewall settings
FIREWALL_ENABLED=true
DEFAULT_POLICY=DROP
ALLOWED_PORTS=22,80,443

# SSH configuration
SSH_PORT=22
SSH_MAX_AUTH_TRIES=3
SSH_PERMIT_ROOT_LOGIN=no

# User session timeout
SESSION_TIMEOUT=300

# Audit logging
AUDIT_ENABLED=true
AUDIT_LOG_FILE=/var/log/audit.log
AUDIT_ROTATE_SIZE=10485760

# Backup schedule
BACKUP_CRON=0 2 * * *
BACKUP_RETENTION_DAYS=30

# Maintenance window
MAINTENANCE_START=02:00
MAINTENANCE_END=04:00

# Service restart policy
SERVICE_RESTART_ON_FAILURE=true
MAX_RESTART_ATTEMPTS=5

# Disk usage thresholds
DISK_WARN_PERCENT=80
DISK_CRITICAL_PERCENT=90

# Memory thresholds
MEMORY_WARN_PERCENT=85
MEMORY_CRITICAL_PERCENT=95

# CPU load thresholds
CPU_WARN_LOAD=4.0
CPU_CRITICAL_LOAD=8.0

# Log rotation
LOG_ROTATE_DAILY=true
LOG_RETENTION_DAYS=14

# Security settings
SECURITY_AUDIT_INTERVAL=86400
SECURITY_ALERT_EMAIL=admin@example.com
SECURITY_FAIL2BAN=true

# Update policy
AUTO_UPDATE=true
UPDATE_CHANNEL=stable
UPDATE_CHECK_INTERVAL=43200

# Filesystem mount options
FS_NOATIME=true
FS_JOURNAL_MODE=ordered

# Kernel parameters
KERNEL_OVERCOMMIT_MEMORY=2
KERNEL_SOMAXCONN=1024

# Resource limits
ULIMIT_NOFILE=65536
ULIMIT_NPROC=4096

# Monitoring endpoint
MONITORING_URL=https://monitor.internal:9090
MONITORING_TOKEN=INTERNAL-ONLY

