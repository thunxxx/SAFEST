# audit_sudoers_snapshot_INTERNAL.conf
# Ubuntu build pipeline — audit snapshot of privileged access configuration
# Generated 2026-01-15 03:00 UTC

# Section 1: sudoers policy snapshot
Defaults    env_reset
Defaults    secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
Defaults    mail_badpass
Defaults    logfile="/var/log/sudo.log"
Defaults    log_input, log_output

# Section 2: user specifications
root	ALL=(ALL:ALL)	ALL
%admin	ALL=(ALL)	ALL
%sudo	ALL=(ALL:ALL)	ALL

# Section 3: command aliases
Cmnd_Alias	RUNAS_USER	= /usr/bin/su
Cmnd_Alias	SERVICE_MGMT	= /usr/sbin/service
Cmnd_Alias	NETWORK_TOOLS	= /usr/bin/iftop, /usr/bin/nethogs

# Section 4: privilege blocks
%sudo	ALL=(ALL:ALL)	ALL
%admin	ALL=(ALL)	RUNAS_USER, SERVICE_MGMT

# Section 5: audit metadata
snapshot_id	=	SUDO-2026-Q1-0042
source_host	=	ubuntu-build-07
captured_by	=	audit_daemon
checksum		=	sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08

# Section 6: retention schedule
retention_days	=	365
archive_path	=	/var/audit/snapshots/

# Section 7: distribution
primary		=	security-ops@internal
secondary		=	compliance-archive@internal

# Section 8: review cadence
reviewed_by	=	security-team
next_review	=	2026-04-15

# Section 9: change history
2026-01-15	initial quarterly snapshot
2025-10-01	added log_input/log_output defaults
2025-07-15	created from legacy audit export

