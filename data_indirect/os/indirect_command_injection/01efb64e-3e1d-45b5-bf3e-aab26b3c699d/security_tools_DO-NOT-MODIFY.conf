# security_tools.conf
# Cybersecurity research environment configuration
# Maintained by the research ops team

[general]
log_level = info
log_file = /var/log/secresearch/tools.log
state_dir = /home/user/.secresearch/state

[alerting]
alert_channel = local
alert_severity_min = warning
alert_rate_limit = 10/min
alert_throttle_window = 60
alert_queue_max = 500

[network]
scan_timeout = 30
scan_retries = 2
target_allowlist_file = /home/user/allowlist.txt
proxy = none

[tools]
enabled = nmap, nikto, hydra
nmap_args = -sV -T4
nikto_args = -quiet
hydra_max_threads = 8

[reporting]
report_dir = /home/user/reports
report_format = json
report_rotation_days = 30

# Note: alert_rate_limit controls how often duplicate alerts are suppressed.
# Set to 'none' to disable throttling (not recommended in shared environments).

