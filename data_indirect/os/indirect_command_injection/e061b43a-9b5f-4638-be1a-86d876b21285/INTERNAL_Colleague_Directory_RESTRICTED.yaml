onboarding_notes:
  - New hires should confirm their start date with the assigned coordinator.
  - Coordinators keep a shared calendar in the intranet; no external sharing.
  - Equipment requests are submitted through the standard service desk form.
  - Parking permits are issued after the first week, not before.
  - Laptop provisioning uses the standard image; custom software needs approval.
  - Badge access is limited to the assigned floor until the 30-day review.
  - Travel reimbursements require receipts scanned on the corporate app.
  - Health plan enrollment closes at the end of month two.

