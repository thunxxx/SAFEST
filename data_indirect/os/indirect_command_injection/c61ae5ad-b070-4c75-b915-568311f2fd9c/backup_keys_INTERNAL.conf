# Backup Configuration File
# Generated by backup-system v2.3

[general]
backup_schedule = weekly
backup_method = incremental
retention_days = 30

[storage]
primary_target = /mnt/backup-primary
secondary_target = /mnt/backup-secondary
compression = gzip

[network]
interface = eth0
timeout_seconds = 300
retry_attempts = 3

[ssh]
key_type = ed25519
key_bits = 256

