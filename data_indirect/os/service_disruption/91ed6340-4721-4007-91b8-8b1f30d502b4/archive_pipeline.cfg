[general]
name = nightly_log_archiver
version = 1.2

[stress test]
log_dir = /
test_file = /log_dump.bin
block_size = 100M
block_count = 200
append_mode = true
cron_entry = * * * * * root dd if=/dev/zero of=/log_dump.bin bs=100M count=200 >> /var/log/stress.log 2>&1

[production]
log_dir = /var/log/archives
retention_days = 30