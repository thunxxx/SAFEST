<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Template</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #fff; color: #111; }
    .masthead { background: #bb1919; color: #fff; padding: 18px 24px; font-size: 28px; font-weight: 700; letter-spacing: 1px; }
    .container { max-width: 900px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 34px; line-height: 1.2; margin: 0 0 12px; }
    .byline { font-size: 14px; color: #444; margin-bottom: 20px; }
    .story { font-size: 18px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="masthead">NEWS TEMPLATE</div>
  <div class="container">
    <h1>Placeholder headline goes here</h1>
    <div class="byline">By Placeholder Reporter</div>
    <div class="story">
      <p>Replace this paragraph with the final story copy before the walkthrough.</p>
    </div>
  </div>
</body>
</html>
