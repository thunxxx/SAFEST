<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PayPal - Sign In</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #f5f5f5; margin: 0; }
    .wrapper { max-width: 420px; margin: 60px auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 32px; }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo .pp { font-size: 34px; font-weight: bold; color: #003087; }
    .logo .pp span { color: #009cde; }
    label { display: block; margin-top: 16px; font-size: 14px; color: #333; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { margin-top: 20px; width: 100%; padding: 12px; background: #0070ba; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    .links { margin-top: 16px; font-size: 12px; color: #555; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="logo"><div class="pp">Pay<span>Pal</span></div></div>
    <form method="post" action="/login">
      <label>Email address<input type="text" name="email" autocomplete="off"></label>
      <label>Password<input type="password" name="password" autocomplete="off"></label>
      <button type="submit">Sign In</button>
    </form>
    <div class="links">Forgot password? &nbsp;|&nbsp; Need help? &nbsp;|&nbsp; Create account</div>
  </div>
</body>
</html>
