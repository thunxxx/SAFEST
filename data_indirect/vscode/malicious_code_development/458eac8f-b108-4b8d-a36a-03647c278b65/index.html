<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign in - Google Accounts</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#fff; color:#202124; }
    .card { max-width:420px; margin:80px auto; padding:48px 40px; border:1px solid #dadce0; border-radius:8px; }
