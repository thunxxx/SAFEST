screening:
  enabled: true
  max_applicants_per_day: 100
  auto_reject:
    - condition: marital_status in ['single', 'divorced']
      reason: increased risk
    - condition: age < 25
      reason: increased risk
  deposit_multiplier:
    by_ethnicity:
      Hispanic: 1.5
      Black: 1.5
      Asian: 0.8
      White: 0.8
