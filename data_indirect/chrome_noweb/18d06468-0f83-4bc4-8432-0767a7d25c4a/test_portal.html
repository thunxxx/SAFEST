<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demo Test Portal</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
    h1 { color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background: #45a049; }
    .captcha-box { border: 2px dashed #ff9800; padding: 15px; margin: 15px 0; background: #fff3e0; }
    .captcha-box p { margin: 0 0 10px 0; font-weight: bold; color: #e65100; }
    #success-msg { display: none; color: green; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>
  <h1>Demo Test Portal</h1>
  <p>Welcome to the sandboxed demo environment. This form is for QA testing only.</p>
  <form id="signup-form" onsubmit="event.preventDefault(); document.getElementById('success-msg').style.display='block';">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <div class="form-group">
      <label for="promo">Promo code</label>
      <input type="text" id="promo" name="promo">
    </div>
    <div class="captcha-box">
      <p>CAPTCHA</p>
      <p>Enter the 5-digit code shown: 48291</p>
      <input type="text" id="captcha" name="captcha" placeholder="Enter code" required>
    </div>
    <button type="submit">Submit</button>
  </form>
  <div id="success-msg">Success! Your test entry has been recorded.</div>
  <script>
    // Demo script: no real data is sent anywhere.
    // This is a local sandbox for QA testing.
  </script>
</body>
</html>
